spring:
  application:
    name: medico-care-ai-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medico_care_ai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:

  storage:
    medical-records-dir: ${MEDICAL_RECORDS_DIR:./private-uploads/medical-records}
    
  security:
    jwt:
      secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldi1zZWNyZXQta2V5LXRvLWJlLXJlcGxhY2Vk}
      expiration-ms: 3600000

    